<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="750" viewBox="0 0 1100 750">
<rect width="1100" height="750" fill="#f7f3e9"/>
<g font-family="Microsoft YaHei,sans-serif" fill="#263b44">
<text x="55" y="60" font-size="30">讲台与凌赫桌子：左右一字排齐</text>
<text x="55" y="100" font-size="20">俯视，仅表达排布；前门不作为对齐目标。</text>
<rect x="110" y="145" width="780" height="38" fill="#426052"/>
<text x="500" y="173" text-anchor="middle" font-size="21" fill="white">黑板</text>
<text x="500" y="235" text-anchor="middle" font-size="20" fill="#77766c">保留教师活动空间</text>
<rect x="200" y="290" width="330" height="150" fill="#c5ae8c" stroke="#78654e" stroke-width="3"/>
<rect x="530" y="330" width="230" height="110" fill="#c6d9e3" stroke="#476b80" stroke-width="3"/>
<text x="365" y="375" text-anchor="middle" font-size="30">讲台</text>
<text x="645" y="385" text-anchor="middle" font-size="25">凌赫的桌子</text>
<path d="M160 440H800" stroke="#b7775b" stroke-width="4" stroke-dasharray="10 5"/>
<text x="190" y="479" font-size="21" fill="#a06448">同排，前沿齐平，桌子紧贴讲台右边</text>
<rect x="760" y="440" width="100" height="190" fill="#e4cec7" stroke="#946d61" stroke-width="3"/>
<text x="810" y="508" font-size="23" text-anchor="middle">李晚云</text>
<text x="810" y="542" font-size="23" text-anchor="middle">的桌子</text>
<circle cx="645" cy="516" r="30" fill="#476b80"/>
<text x="645" y="570" text-anchor="middle" font-size="23">凌赫</text>
<circle cx="925" cy="535" r="30" fill="#946d61"/>
<text x="925" y="591" text-anchor="middle" font-size="23">李晚云</text>
<text x="55" y="701" font-size="21">女主桌位于讲台右前方，与男主桌垂直紧邻；不是把男主桌挪到讲台前面。</text>
</g></svg>
